name: Bug report
description: Something in the code or notebooks does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what occurred instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Notebook and cell, or a minimal snippet using `oisst_fno`.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or output
      render: text
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: input
    id: torch-version
    attributes:
      label: PyTorch version
      placeholder: "2.3.1"
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 14 / Windows 11"
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `make quality` and it did not explain the problem
        - label: This is not a data-download failure on NOAA's side
