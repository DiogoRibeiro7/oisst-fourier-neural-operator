[tool.poetry]
name = "oisst-fourier-neural-operator"
version = "0.1.0"
description = "Notebook-first Fourier Neural Operator study for real NOAA OISST forecasting"
authors = ["Diogo Ribeiro"]
readme = "README.md"
packages = [{ include = "oisst_fno", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = ">=2.0,<3.0"
pandas = ">=2.2,<3.0"
xarray = ">=2024.6"
netcdf4 = ">=1.7"
requests = ">=2.32"
scipy = ">=1.14"
scikit-learn = ">=1.5"
matplotlib = ">=3.9"
torch = ">=2.3,<3.0"
tqdm = ">=4.66"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
ruff = ">=0.6"
mypy = ">=1.11"
pre-commit = ">=3.8"
jupyterlab = ">=4.2"
ipykernel = ">=6.29"
nbformat = ">=5.10"
types-requests = ">=2.32"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["notebooks/"]

[[tool.mypy.overrides]]
module = ["xarray.*", "netCDF4.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
